apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: driftwatchscans.driftwatch.io
spec:
  group: driftwatch.io
  names:
    kind: DriftWatchScan
    listKind: DriftWatchScanList
    plural: driftwatchscans
    singular: driftwatchscan
    shortNames:
      - dws
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Repo
          type: string
          jsonPath: .spec.repo
        - name: Drifts
          type: integer
          jsonPath: .status.driftCount
        - name: Last Scan
          type: string
          jsonPath: .status.lastScanAt
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - repo
              properties:
                repo:
                  type: string
                  description: GitOps repository URL (HTTPS or SSH)
                branch:
                  type: string
                  default: main
                  description: Branch to compare against
                path:
                  type: string
                  default: "."
                  description: Subdirectory within the repo to scan
                interval:
                  type: integer
                  default: 300
                  description: Seconds between scans
                namespace:
                  type: string
                  description: Restrict scan to a specific namespace
                tokenSecret:
                  type: string
                  description: Name of a Secret in the same namespace containing a "token" key for private repos
            status:
              type: object
              x-kubernetes-preserve-unknown-fields: true
