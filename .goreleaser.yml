version: 2

project_name: driftwatch

before:
  hooks:
    - go mod tidy

builds:
  - id: driftwatch
    main: ./cmd/driftwatch
    binary: driftwatch
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

  - id: driftwatch-operator
    main: ./cmd/operator
    binary: driftwatch-operator
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.Date}}

archives:
  - id: driftwatch
    ids:
      - driftwatch
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
  - id: driftwatch-operator
    ids:
      - driftwatch-operator
    name_template: "{{ .ProjectName }}-operator_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - Merge pull request
      - Merge branch

homebrew_casks:
  - name: driftwatch
    ids:
      - driftwatch
    repository:
      owner: Richonn
      name: homebrew-driftwatch
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: "https://github.com/Richonn/DriftWatch"
    description: "Detect drift between your live Kubernetes cluster and your GitOps repository"
    license: "MIT"

release:
  github:
    owner: Richonn
    name: DriftWatch
  draft: false
  prerelease: auto
  name_template: "v{{ .Version }}"
